workflows:
  ios-workflow:
    name: iOS 26.6 WORKING - 3uTools Ready
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Setup Flutter & Pods
        script: |
          set -ex
          ls -la
          if [ -f "pubspec.yaml" ]; then
            echo ">>> Flutter project detected"
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock build
            flutter pub get
            cd ios
            pod install --repo-update || true
            cd ..
          else
            if [ -d "ios" ]; then
              cd ios
              pod install --repo-update || true
              cd ..
            fi
          fi

      - name: Fix to Make App OPEN on iOS 26.6
        script: |
          set -ex
          echo ">>> Patching entitlements - remove only Push & Associated Domains"
          find . -name "*.entitlements" -type f | while read F; do
            echo "Patching $F"
            plutil -remove com.apple.developer.associated-domains "$F" 2>&1 || true
            plutil -remove aps-environment "$F" 2>&1 || true
            cat "$F" || true
          done
          
          echo ">>> Patching Info.plist to allow opening on iOS 26.6"
          find . -name "Info.plist" -type f | while read PLIST; do
            echo "Checking $PLIST"
            # Add NSAppTransportSecurity to allow web content for PWA
            plutil -replace NSAppTransportSecurity.NSAllowsArbitraryLoads -bool YES "$PLIST" 2>&1 || plutil -insert NSAppTransportSecurity -xml "<dict><key>NSAllowsArbitraryLoads</key><true/></dict>" "$PLIST" 2>&1 || true
            # Ensure CFBundleExecutable exists
            plutil -p "$PLIST" | head -30 || true
          done

      - name: Build IPA - Method that WORKS (3.39MB)
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa /tmp/xcodebuild.log /tmp/flutter_build.log
          mkdir -p build/ios/ipa
          APP_PATH=""

          # Step 1: Flutter build if Flutter project
          if [ -f "pubspec.yaml" ]; then
            echo ">>> flutter build ios --release --no-codesign"
            flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/flutter_build.log || true
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
            echo "After flutter: APP_PATH=$APP_PATH"
          fi

          # Step 2: xcodebuild archive - THE METHOD THAT BUILT 3.39MB SUCCESSFULLY
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Trying xcodebuild archive"
            if [ -d "ios/Runner.xcworkspace" ]; then
              WORKSPACE="ios/Runner.xcworkspace"
              if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then SCHEME="g000st"; else SCHEME="Runner"; fi
              XCODE_BASE_ARGS="-workspace $WORKSPACE -scheme $SCHEME"
            elif [ -d "g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace g000st.xcworkspace -scheme g000st"
            elif [ -d "ios/g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace ios/g000st.xcworkspace -scheme g000st"
            else
              XCODE_BASE_ARGS="-project g000st.xcodeproj -scheme g000st"
            fi
            echo "Archive: $XCODE_BASE_ARGS"
            xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true
            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1); fi
          fi

          # Final search
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Searching all .app"
            find . -name "*.app" -type d 2>/dev/null | head -20
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1)
          fi

          echo "FINAL APP_PATH: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "FAILED - no .app found"
            tail -n 300 /tmp/xcodebuild.log || true
            tail -n 300 /tmp/flutter_build.log || true
            exit 1
          fi

          ls -lh "$APP_PATH" || true
          du -sh "$APP_PATH" || true
          ls -lh "$APP_PATH/Info.plist" || true

          # Create IPA
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-iOS26-OPEN.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-iOS26-OPEN.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo ">>> SUCCESS - IPA for 3uTools that should OPEN!"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - /tmp/flutter_build.log
