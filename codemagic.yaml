workflows:
  ios-sideloadly-free-FINAL:
    name: iOS Free - For Sideloadly & 3uTools (iOS 26.6)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Setup Flutter & Pods
        script: |
          set -ex
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock
            flutter pub get
            cd ios
            pod repo update || true
            pod install --repo-update
            cd ..
          fi
          if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update || true
            cd ..
          fi

      - name: STRIP Push & Associated Domains for Free Account
        script: |
          set -ex
          echo ">>> Stripping entitlements that break free signing..."
          find . -name "*.entitlements" -type f | while read ENT; do
            echo "Found entitlements: $ENT"
            cat "$ENT"
            plutil -remove com.apple.developer.associated-domains "$ENT" || true
            plutil -remove aps-environment "$ENT" || true
            plutil -remove com.apple.developer.applesignin "$ENT" || true
            plutil -remove com.apple.developer.push-notifications "$ENT" || true
            echo "After strip:"
            cat "$ENT" || true
          done
          
          # Also remove from project.pbxproj if exists
          find . -name "project.pbxproj" | while read PBX; do
            echo "Patching $PBX"
            sed -i '' '/com.apple.developer.associated-domains/d' "$PBX" || sed -i '/com.apple.developer.associated-domains/d' "$PBX" || true
            sed -i '' '/ASSETCATALOG_COMPILER_APPICON/d' "$PBX" || true
          done || true
          
          echo ">>> Entitlements stripped - Ready for free Apple ID"

      - name: Build Unsigned IPA for Sideloadly iOS 26.6
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa

          if [ -f "pubspec.yaml" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          else
            APP_PATH=""
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            # Find correct workspace/scheme
            if [ -d "ios/Runner.xcworkspace" ]; then
              WORKSPACE="ios/Runner.xcworkspace"
              if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then SCHEME="g000st"; else SCHEME="Runner"; fi
              XCODE_BASE_ARGS="-workspace $WORKSPACE -scheme $SCHEME"
            elif [ -d "g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace g000st.xcworkspace -scheme g000st"
            elif [ -d "ios/g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace ios/g000st.xcworkspace -scheme g000st"
            else
              XCODE_BASE_ARGS="-project g000st.xcodeproj -scheme g000st"
            fi

            echo "Building $XCODE_BASE_ARGS"
            xcodebuild archive $XCODE_BASE_ARGS \
              -archivePath /tmp/g000st.xcarchive \
              -destination "generic/platform=iOS" \
              -derivedDataPath /tmp/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true

            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v Tests | head -n 1); fi
          fi

          echo "FINAL APP: $APP_PATH"
          ls -lh "$APP_PATH"
          du -sh "$APP_PATH"

          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-sideloadly-fixed.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-sideloadly-fixed.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo ">>> IPA ready for Sideloadly - Push & Associated Domains removed"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log

  ios-paid-if-you-have-paid-dev-account:
    name: iOS Paid - With Push & Domains (requires paid Apple Dev)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: apple
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
    scripts:
      - name: Set up signing (needs Paid account with Push + Associated Domains enabled)
        script: |
          xcode-project use-profiles
      - name: Setup Pods
        script: |
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock
            flutter pub get
            cd ios
            pod install --repo-update
            cd ..
          fi
      - name: Build IPA
        script: |
          if [ -d "ios/Runner.xcworkspace" ]; then
            xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
          else
            xcode-project build-ipa --project g000st.xcodeproj --scheme g000st
          fi
    artifacts:
      - build/ios/ipa/*.ipa
