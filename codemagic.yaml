workflows:
  ios-ipa:
    name: iOS IPA V5 - Flutter Full Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Build Flutter IPA properly (fix 3.39MB bug)
        script: |
          set -ex
          echo "=== Flutter version ==="
          flutter --version || echo "No flutter"
          echo "=== Files ==="
          ls -la
          echo "=== Pubspec check ==="
          cat pubspec.yaml | head -30 || echo "No pubspec at root"
          ls -la ios/ 2>&1 | head -50 || echo "No ios folder"

          rm -rf /tmp/g000st.xcarchive
          rm -rf /tmp/Payload
          rm -rf /tmp/DerivedData
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          if [ -f "pubspec.yaml" ]; then
            echo ">>> FLUTTER PROJECT DETECTED - Building properly"
            flutter clean || true
            flutter pub get
            
            # Pod install
            if [ -d "ios" ]; then
              echo "Installing pods in ios/"
              cd ios
              pod install --repo-update || pod install
              cd ..
            fi
            if [ -f "Podfile" ]; then
              echo "Installing pods at root"
              pod install --repo-update || pod install
            fi

            echo ">>> Building Flutter iOS release --no-codesign"
            flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/flutter_build.log || true
            
            # Find the app - Flutter puts it in build/ios/iphoneos/
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
            echo "Found APP after flutter build: $APP_PATH"
            ls -lh "$APP_PATH" || echo "App not found"
            
            # Check if app has Flutter engine
            if [ -d "$APP_PATH" ]; then
              echo "=== App size ==="
              du -sh "$APP_PATH"
              echo "=== Frameworks ==="
              ls -lh "$APP_PATH/Frameworks" | head -20 || echo "No Frameworks folder"
              echo "=== Flutter assets ==="
              ls -lh "$APP_PATH/flutter_assets" | head -20 || echo "No flutter_assets - THIS IS THE BUG!"
            fi
          else
            echo ">>> NOT a Flutter root project, trying Xcode build"
            APP_PATH=""
          fi

          # Fallback if flutter build failed or not a flutter project
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Fallback to Xcode build (native)"
            WORKSPACE_FILE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
            if [ -d "ios" ]; then
              # Try ios folder structure
              if [ -d "ios/${WORKSPACE_FILE}" ]; then
                WORKSPACE_FILE="ios/${WORKSPACE_FILE}"
                XCODE_PROJECT="ios/${XCODE_PROJECT}"
              elif [ -d "ios/Runner.xcworkspace" ]; then
                WORKSPACE_FILE="ios/Runner.xcworkspace"
                XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme Runner"
              fi
            fi
            
            if [ -d "$WORKSPACE_FILE" ]; then
              echo "Found workspace: $WORKSPACE_FILE"
              XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"
            else
              echo "No workspace, using project"
              XCODE_BASE_ARGS="-project $XCODE_PROJECT -scheme $XCODE_SCHEME"
            fi
            echo "Xcode args: $XCODE_BASE_ARGS"

            xcodebuild archive $XCODE_BASE_ARGS \
              -archivePath /tmp/g000st.xcarchive \
              -destination "generic/platform=iOS" \
              -derivedDataPath /tmp/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO \
              SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true

            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v Tests | head -n 1)
            fi
          fi

          echo "=== FINAL APP PATH: $APP_PATH ==="
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "FAILED TO FIND APP! Listing everything:"
            find /tmp -name "*.app" | head -20
            find build -name "*.app" | head -20
            exit 1
          fi

          ls -lh "$APP_PATH"
          du -sh "$APP_PATH"

          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/

          cd /tmp
          zip -r -9 g000st-unsigned.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo "=== IPA DETAILS ==="
          du -h $CM_BUILD_DIR/build/ios/ipa/*.ipa
          unzip -l $CM_BUILD_DIR/build/ios/ipa/g000st-unsigned.ipa | head -100

      - name: Upload IPA
        script: |
          set -ex
          IPA_PATH=$(find $CM_BUILD_DIR/build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA: $IPA_PATH"
          ls -lh "$IPA_PATH"
          curl -F "file=@$IPA_PATH" https://file.io || echo "file.io failed"
          echo ""
          curl -F "file=@$IPA_PATH" https://tmpfiles.org/api/v1/upload || echo "tmpfiles failed"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/flutter_build.log
      - /tmp/xcodebuild.log
