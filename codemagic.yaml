workflows:
  ios-workflow:
    name: iOS Workflow - iOS 26.6 FIXED Pods
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: apple
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        # اذا مشروعك اسمو g000st مو Runner غير هدول:
        # XCODE_WORKSPACE: g000st.xcworkspace
        # XCODE_SCHEME: g000st
    scripts:
      - name: Set up signing profiles from App Store Connect
        script: |
          xcode-project use-profiles

      - name: Fix Pods - Clean and Install
        script: |
          set -ex
          if [ -f "pubspec.yaml" ]; then
            echo ">>> Flutter project - Fixing Pods"
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
            flutter pub get
            cd ios
            pod repo update || true
            pod install --repo-update
            cd ..
            ls -lh ios/Pods/Target\ Support\ Files/ || true
          else
            echo ">>> Native project"
            if [ -f "Podfile" ]; then
              pod repo update || true
              pod install --repo-update
            fi
            if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
              cd ios
              rm -rf Pods Podfile.lock
              pod repo update || true
              pod install --repo-update
              cd ..
            fi
          fi

      - name: Build IPA - Signed for iOS 26.6
        script: |
          set -ex
          # Auto-detect correct workspace/scheme
          if [ -d "ios/Runner.xcworkspace" ]; then
            WORKSPACE="ios/Runner.xcworkspace"
            # Check available schemes
            xcodebuild -list -workspace "$WORKSPACE" || true
            # Try g000st first, then Runner
            if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then
              SCHEME="g000st"
            else
              SCHEME="Runner"
            fi
          elif [ -d "g000st.xcworkspace" ]; then
            WORKSPACE="g000st.xcworkspace"
            SCHEME="g000st"
          elif [ -d "ios/g000st.xcworkspace" ]; then
            WORKSPACE="ios/g000st.xcworkspace"
            SCHEME="g000st"
          else
            WORKSPACE="ios/Runner.xcworkspace"
            SCHEME="Runner"
          fi

          echo "Building with WORKSPACE=$WORKSPACE SCHEME=$SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"
          
          ls -lh build/ios/ipa/ || true
          du -h build/ios/ipa/*.ipa || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
