workflows:
  ios-workflow:
    name: iOS FINAL - No Pods Archive
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
    scripts:
      - name: Fix Pods - Deintegrate All
        script: |
          set -x
          echo "=== Find all Podfiles ==="
          find . -name "Podfile" 2>/dev/null
          
          # Completely remove CocoaPods integration from g000st.xcodeproj
          # This fixes: Unable to read contents of XCFileList Pods-g000st-...
          # and ** ARCHIVE FAILED **
          echo "Deintegrating Pods..."
          if [ -f "Podfile" ]; then
            pod deintegrate || true
          fi
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod deintegrate || true
            cd ..
          fi
          
          rm -rf Pods ios/Pods Podfile.lock ios/Podfile.lock build
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          
          if [ -f "pubspec.yaml" ]; then
            flutter clean || true
            flutter pub get || true
          fi
          
          # Remove Pods references from project if still there
          echo "Checking g000st.xcodeproj..."
          grep -r "Pods-g000st" g000st.xcodeproj/ 2>&1 | head -5 || echo "No Pods refs"

      - name: Build - No Pods, No Archive, Just Build
        script: |
          set -x
          rm -rf /tmp/Payload build/ios/ipa /tmp/DerivedData /tmp/*.log
          mkdir -p build/ios/ipa
          
          # Build without archive - build is more forgiving than archive
          # And without Pods, it won't fail on XCFileList
          echo "Building g000st WITHOUT Pods..."
          xcodebuild build -project g000st.xcodeproj -scheme g000st -configuration Release -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO ENABLE_USER_SCRIPT_SANDBOXING=NO 2>&1 | tee /tmp/xcodebuild.log || true
          
          echo "=== Full log tail ==="
          tail -n 100 /tmp/xcodebuild.log
          
          echo "=== Searching .app ==="
          find /tmp/DerivedData -name "*.app" -type d 2>/dev/null
          find . -name "*.app" -type d 2>/dev/null | grep -v Tests
          
          APP=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1)
          if [ -z "$APP" ]; then APP=$(find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi
          if [ -z "$APP" ]; then APP=$(find build -name "*.app" -type d 2>/dev/null | head -n 1); fi
          
          echo "FINAL APP: $APP"
          if [ -z "$APP" ]; then
            echo "FAILED - no app"
            exit 1
          fi
          
          ls -lh "$APP"
          du -sh "$APP"
          
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-NoPods-3MB.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-NoPods-3MB.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
