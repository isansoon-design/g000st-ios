workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - ./Pods
    scripts:
      - name: Install Pods
        script: |
          pod install
      - name: Build IPA for TestFlight
        script: |
          xcodebuild -workspace g000st.xcworkspace -scheme g000st -config Release -sdk iphoneos -archivePath $CM_BUILD_DIR/g000st.xcarchive archive
          mkdir -p $CM_BUILD_DIR/ipa/Payload
          cp -R $CM_BUILD_DIR/g000st.xcarchive/Products/Applications/*.app $CM_BUILD_DIR/ipa/Payload
          cd $CM_BUILD_DIR/ipa && zip -r g000st.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
