workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "g000st.xcodeproj"
        XCODE_SCHEME: "g000st"
        BUNDLE_ID: "com.isansoon.g000st"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install pods
        script: |
          if [ -f "Podfile" ]; then
            pod install
          fi
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - isansoon.design@gmail.com
