workflows:
  ios-workflow:
    name: iOS FINAL - Guaranteed Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
    scripts:
      - name: Setup
        script: |
          set -ex
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock build
            flutter pub get
            cd ios
            pod install --repo-update
            cd ..
          fi

      - name: Fix Entitlements - Keep Minimal
        script: |
          set -ex
          # Only remove the 2 bad keys, keep everything else
          find . -name "*.entitlements" -type f | while read F; do
            echo "Patching $F"
            plutil -remove com.apple.developer.associated-domains "$F" 2>&1 || true
            plutil -remove aps-environment "$F" 2>&1 || true
            cat "$F"
          done

      - name: Build IPA
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload build/ios/ipa
          mkdir -p build/ios/ipa
          
          # Use the method that worked before (3.39MB)
          if [ -f "pubspec.yaml" ]; then
            flutter build ios --release --no-codesign 2>&1 | tee /tmp/flutter_build.log || true
          fi
          
          if [ -d "ios/Runner.xcworkspace" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination "generic/platform=iOS" -archivePath /tmp/g000st.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES SKIP_INSTALL=NO archive 2>&1 | tee /tmp/xcodebuild.log || true
            APP_PATH=$(find /tmp/g000st.xcarchive -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1); fi
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find build -name "*.app" -type d | head -n 1); fi
          else
            xcodebuild -project g000st.xcodeproj -scheme g000st -configuration Release -destination "generic/platform=iOS" -archivePath /tmp/g000st.xcarchive CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee /tmp/xcodebuild.log || true
            APP_PATH=$(find /tmp/g000st.xcarchive -name "*.app" -type d | head -n 1)
          fi
          
          echo "APP_PATH=$APP_PATH"
          ls -lh "$APP_PATH" || (echo "Not found, searching:"; find . -name "*.app" -type d | head -20; exit 1)
          
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-FINAL-WORKING.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-FINAL-WORKING.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - /tmp/flutter_build.log
