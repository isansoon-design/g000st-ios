workflows:
  ios-workflow:
    name: iOS Workflow Flutter Full
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
    scripts:
      - name: Build Flutter IPA full
        script: |
          set -ex
          flutter clean
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ios --release --no-codesign --verbose
          APP=$(find build -name "*.app" -type d | head -1)
          echo "APP: $APP"
          du -sh "$APP"
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r g000st-full.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          cp g000st-full.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
