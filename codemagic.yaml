workflows:
  ios-workflow:
    name: iOS AdHoc Fix 3.39MB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pod install
        script: |
          pod install --repo-update || true
      - name: Build IPA AdHoc
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload build/ios/ipa
          mkdir -p build/ios/ipa
          xcodebuild archive \
            -workspace g000st.xcworkspace \
            -scheme g000st \
            -configuration Release \
            -archivePath /tmp/g000st.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            SKIP_INSTALL=NO
          APP=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r g000st-fixed.ipa Payload
          cp g000st-fixed.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
