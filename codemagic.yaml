workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Build unsigned IPA
        script: |
          set -ex
          echo "Building $XCODE_PROJECT"
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -derivedDataPath build/derived_data | xcpretty || true
          APP_PATH=$(find build/derived_data -type d -name "*.app" | head -n 1)
          echo "Found APP: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build/ios/ipa
          zip -r build/ios/ipa/g000st-unsigned.ipa Payload
          rm -rf Payload
          ls -lh build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/derived_data/Logs/**/*.log

