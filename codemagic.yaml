workflows:
  ios-workflow:
    name: iOS Workflow - Signed with Apple
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      developer_portal: apple
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Flutter setup & pods
        script: |
          set -ex
          flutter --version
          ls -la
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            flutter pub get
            if [ -d "ios" ]; then
              cd ios
              pod install --repo-update || pod install
              cd ..
            fi
            if [ -f "Podfile" ]; then
              pod install --repo-update || pod install
            fi
          fi
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -ex
          # If flutter project, build ipa via flutter, else via xcode-project
          if [ -f "pubspec.yaml" ]; then
            flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist || flutter build ios --release
            # Codemagic's xcode-project build-ipa will find it
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || true
          else
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          fi
          ls -lh build/ios/ipa/ || true
          find build -name "*.ipa" -ls || true
    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.ipa

  ios-ipa:
    name: iOS IPA V5 - Flutter Full Build Unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Build Flutter IPA unsigned
        script: |
          set -ex
          flutter --version || true
          ls -la
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa
          if [ -f "pubspec.yaml" ]; then
            echo ">>> FLUTTER PROJECT"
            flutter clean || true
            flutter pub get
            if [ -d "ios" ]; then cd ios; pod install --repo-update || pod install; cd ..; fi
            if [ -f "Podfile" ]; then pod install --repo-update || pod install; fi
            flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/flutter_build.log || true
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          else
            APP_PATH=""
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Fallback Xcode build"
            WORKSPACE_FILE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
            if [ -d "ios" ]; then
              if [ -d "ios/${WORKSPACE_FILE}" ]; then WORKSPACE_FILE="ios/${WORKSPACE_FILE}"; XCODE_PROJECT="ios/${XCODE_PROJECT}"; 
              elif [ -d "ios/Runner.xcworkspace" ]; then WORKSPACE_FILE="ios/Runner.xcworkspace"; XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme Runner"; fi
            fi
            if [ -z "${XCODE_BASE_ARGS:-}" ]; then
              if [ -d "$WORKSPACE_FILE" ]; then XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"; else XCODE_BASE_ARGS="-project $XCODE_PROJECT -scheme $XCODE_SCHEME"; fi
            fi
            xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true
            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v Tests | head -n 1); fi
          fi
          echo "FINAL APP: $APP_PATH"
          ls -lh "$APP_PATH"; du -sh "$APP_PATH"
          mkdir -p /tmp/Payload; rm -rf /tmp/Payload/*; cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp; zip -r -9 g000st-unsigned.ipa Payload; mkdir -p $CM_BUILD_DIR/build/ios/ipa; mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/; ls -lh $CM_BUILD_DIR/build/ios/ipa/; du -h $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - name: Upload IPA
        script: |
          IPA_PATH=$(find $CM_BUILD_DIR/build/ios/ipa -name "*.ipa" | head -n 1)
          ls -lh "$IPA_PATH"
          curl -F "file=@$IPA_PATH" https://file.io || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/flutter_build.log
      - /tmp/xcodebuild.log
