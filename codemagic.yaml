workflows:
  ios-ipa:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Build unsigned IPA (fixed)
        script: |
          set -ex
          echo "Building $XCODE_PROJECT / $XCODE_SCHEME - FIXED METHOD"
          rm -rf /tmp/g000st.xcarchive
          rm -rf /tmp/Payload
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath /tmp/g000st.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SKIP_INSTALL=NO

          APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Found APP: $APP_PATH"
          ls -lh "$APP_PATH"

          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          cd /tmp
          zip -r g000st-unsigned.ipa Payload
          mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
