workflows:
  ios-workflow:
    name: iOS REAL Full IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Pod install
        script: |
          pod install --repo-update
      - name: Build IPA - Real
        script: |
          set -ex
          rm -rf build /tmp/Payload
          mkdir -p build/ios/ipa
          if [ -d "g000st.xcworkspace" ]; then
            xcodebuild build \
              -workspace g000st.xcworkspace \
              -scheme g000st \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath /tmp/DerivedData \
              CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
          else
            xcodebuild build \
              -project g000st.xcodeproj \
              -scheme g000st \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -derivedDataPath /tmp/DerivedData \
              CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
          fi
          APP=$(find /tmp/DerivedData/Build/Products -name "*.app" | grep Release-iphoneos | head -1)
          ls -lh "$APP"
          du -sh "$APP"
          ls -lh "$APP/Frameworks" || echo "No Frameworks"
          mkdir -p /tmp/Payload && cp -R "$APP" /tmp/Payload/
          cd /tmp && zip -r g000st-real.ipa Payload
          cp g000st-real.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
