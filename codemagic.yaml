workflows:
  ios-workflow:
    name: iOS Workflow - iOS 26.6 FINAL
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: apple
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
        XCODE_WORKSPACE: g000st.xcworkspace
    scripts:
      - name: Set up signing profiles from App Store Connect
        script: |
          xcode-project use-profiles

      - name: Flutter setup (if Flutter project)
        script: |
          if [ -f "pubspec.yaml" ]; then
            echo ">>> Flutter project detected"
            flutter clean
            flutter pub get
            if [ -d "ios" ]; then
              cd ios
              pod install --repo-update || pod install
              cd ..
            fi
          fi

      - name: Build IPA - Signed for iOS 26.6
        script: |
          set -ex
          # Try workspace first (best for Flutter and Pods)
          if [ -d "$XCODE_WORKSPACE" ]; then
            echo "Building with workspace $XCODE_WORKSPACE"
            xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
          elif [ -d "ios/Runner.xcworkspace" ]; then
            echo "Building Flutter Runner workspace"
            xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner"
          elif [ -f "$XCODE_PROJECT/project.pbxproj" ]; then
            echo "Building with project $XCODE_PROJECT"
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          else
            echo "Fallback: building Runner"
            xcode-project build-ipa --workspace "ios/Runner.xcworkspace" --scheme "Runner"
          fi
          
          ls -lh build/ios/ipa/ || true
          du -h build/ios/ipa/*.ipa || true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        # Set to true if you want automatic TestFlight upload
        submit_to_testflight: false

  ios-ipa-unsigned-for-sideloadly:
    name: iOS IPA Unsigned - For Sideloadly iOS 26.6
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Build unsigned IPA for Sideloadly (Ad-Hoc)
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa
          
          if [ -f "pubspec.yaml" ]; then
            flutter clean || true
            flutter pub get
            if [ -d "ios" ]; then cd ios; pod install --repo-update || pod install; cd ..; fi
            flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/flutter_build.log || true
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          else
            APP_PATH=""
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            WORKSPACE_FILE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
            if [ -d "ios/${WORKSPACE_FILE}" ]; then 
              XCODE_PROJECT="ios/${XCODE_PROJECT}"
              WORKSPACE_FILE="ios/${WORKSPACE_FILE}"
              XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"
            elif [ -d "ios/Runner.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace ios/Runner.xcworkspace -scheme Runner"
            elif [ -d "$WORKSPACE_FILE" ]; then
              XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"
            else
              XCODE_BASE_ARGS="-project $XCODE_PROJECT -scheme $XCODE_SCHEME"
            fi

            xcodebuild archive $XCODE_BASE_ARGS               -archivePath /tmp/g000st.xcarchive               -destination "generic/platform=iOS"               -derivedDataPath /tmp/DerivedData               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               CODE_SIGN_IDENTITY=""               CODE_SIGN_STYLE=Manual               AD_HOC_CODE_SIGNING_ALLOWED=YES               COMPILER_INDEX_STORE_ENABLE=NO               SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true

            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then 
              APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v Tests | head -n 1)
            fi
          fi

          echo "FINAL APP: $APP_PATH"
          ls -lh "$APP_PATH"
          du -sh "$APP_PATH"

          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-unsigned.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          du -h $CM_BUILD_DIR/build/ios/ipa/*.ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/flutter_build.log
      - /tmp/xcodebuild.log
