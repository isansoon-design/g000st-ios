workflows:
  ios-ipa:
    name: iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Prepare & list
        script: |
          set -ex
          echo "=== Files ==="
          ls -la
          echo "=== Check Podfile ==="
          if [ -f "Podfile" ]; then
            echo "Podfile found, installing..."
            pod install --repo-update || pod install
          else
            echo "No Podfile"
          fi
          echo "=== Xcode list ==="
          xcodebuild -list || true
          xcodebuild -project "$XCODE_PROJECT" -list || true
          echo "=== Schemes ==="
          ls -la "$XCODE_PROJECT/xcshareddata/xcschemes/" || echo "No shared schemes"
      - name: Build unsigned IPA (fixed v4 - Firebase fix)
        script: |
          set -ex
          echo "Building $XCODE_PROJECT / $XCODE_SCHEME - FIXED V4 Firebase"
          rm -rf /tmp/g000st.xcarchive
          rm -rf /tmp/Payload
          rm -rf /tmp/DerivedData
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          # Detect workspace (needed for Firebase / Pods)
          WORKSPACE_FILE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
          if [ -d "$WORKSPACE_FILE" ]; then
            echo "Found workspace: $WORKSPACE_FILE - using workspace"
            XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"
          else
            echo "No workspace found, using project: $XCODE_PROJECT"
            XCODE_BASE_ARGS="-project $XCODE_PROJECT -scheme $XCODE_SCHEME"
          fi
          echo "Xcode args: $XCODE_BASE_ARGS"

          # Try archive with ad-hoc signing (most compatible for Xcode 16)
          set +e
          xcodebuild archive $XCODE_BASE_ARGS \
            -archivePath /tmp/g000st.xcarchive \
            -destination "generic/platform=iOS" \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "Archive exit code: $ARCHIVE_EXIT"

          if [ $ARCHIVE_EXIT -ne 0 ]; then
            echo "Archive failed, trying direct build..."
            xcodebuild build $XCODE_BASE_ARGS \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath /tmp/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | tee /tmp/xcodebuild.log

            APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v "Tests" | head -n 1)
          else
            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
          fi

          echo "Found APP: $APP_PATH"
          ls -lh "$APP_PATH" || (echo "APP not found! Listing DerivedData"; find /tmp -name "*.app" | head -20; exit 1)

          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/

          cd /tmp
          zip -r g000st-unsigned.ipa Payload
          mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo "IPA READY!"
      - name: Upload IPA to get direct link
        script: |
          set -ex
          IPA_PATH=$(find $CM_BUILD_DIR/build/ios/ipa -name "*.ipa" | head -n 1)
          echo "Found IPA at: $IPA_PATH"
          ls -lh "$IPA_PATH"
          echo "=== Uploading to file.io ==="
          curl -F "file=@$IPA_PATH" https://file.io || echo "file.io failed"
          echo ""
          echo "=== Uploading to tmpfiles.org ==="
          curl -F "file=@$IPA_PATH" https://tmpfiles.org/api/v1/upload || echo "tmpfiles failed"
          echo ""
          echo "IPA is also in Artifacts tab!"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - /tmp/xcodebuild_logs/*.log
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Prepare & list
        script: |
          set -ex
          ls -la
          if [ -f "Podfile" ]; then pod install --repo-update || pod install; fi
          xcodebuild -list || true
          ls -la *.xcworkspace 2>&1 || echo "No workspace"
      - name: Build unsigned IPA (fixed v4 Firebase)
        script: |
          set -ex
          WORKSPACE_FILE="${XCODE_PROJECT%.xcodeproj}.xcworkspace"
          if [ -d "$WORKSPACE_FILE" ]; then
            XCODE_BASE_ARGS="-workspace $WORKSPACE_FILE -scheme $XCODE_SCHEME"
          else
            XCODE_BASE_ARGS="-project $XCODE_PROJECT -scheme $XCODE_SCHEME"
          fi
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa
          set +e
          xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          set -e
          if [ $ARCHIVE_EXIT -ne 0 ]; then
            xcodebuild build $XCODE_BASE_ARGS -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/xcodebuild.log
            APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v "Tests" | head -n 1)
          else
            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
          fi
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r g000st-unsigned.ipa Payload
          mv /tmp/g000st-unsigned.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
      - name: Upload IPA link
        script: |
          IPA_PATH=$(find $CM_BUILD_DIR/build/ios/ipa -name "*.ipa" | head -n 1)
          curl -F "file=@$IPA_PATH" https://file.io || true
          curl -F "file=@$IPA_PATH" https://tmpfiles.org/api/v1/upload || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
