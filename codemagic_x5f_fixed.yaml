workflows:
  ios-workflow:
    name: iOS Free - For Sideloadly & 3uTools (iOS 26.6)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Setup Flutter & Pods
        script: |
          set -ex
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock
            flutter pub get
            cd ios
            pod repo update || true
            pod install --repo-update
            cd ..
          fi

      - name: STRIP Push & Associated Domains for Free Account
        script: |
          set -ex
          echo ">>> Stripping entitlements that break free signing..."
          find . -name "*.entitlements" -type f | while read ENT; do
            echo "Found: $ENT"
            cat "$ENT"
            plutil -remove com.apple.developer.associated-domains "$ENT" || true
            plutil -remove aps-environment "$ENT" || true
            plutil -remove com.apple.developer.applesignin "$ENT" || true
            plutil -remove com.apple.developer.push-notifications "$ENT" || true
            echo "After:"
            cat "$ENT" || true
          done
          echo ">>> Ready for free Apple ID"

      - name: Build Unsigned IPA for Sideloadly iOS 26.6
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa
          if [ -d "ios/Runner.xcworkspace" ]; then
            WORKSPACE="ios/Runner.xcworkspace"
            if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then SCHEME="g000st"; else SCHEME="Runner"; fi
            XCODE_BASE_ARGS="-workspace $WORKSPACE -scheme $SCHEME"
          elif [ -d "g000st.xcworkspace" ]; then
            XCODE_BASE_ARGS="-workspace g000st.xcworkspace -scheme g000st"
          elif [ -d "ios/g000st.xcworkspace" ]; then
            XCODE_BASE_ARGS="-workspace ios/g000st.xcworkspace -scheme g000st"
          else
            XCODE_BASE_ARGS="-project g000st.xcodeproj -scheme g000st"
          fi
          echo "Building $XCODE_BASE_ARGS"
          xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true
          APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d | grep -v Tests | head -n 1); fi
          echo "FINAL APP: $APP_PATH"
          ls -lh "$APP_PATH"
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-sideloadly-fixed.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-sideloadly-fixed.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
