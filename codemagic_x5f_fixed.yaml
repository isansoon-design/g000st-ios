workflows:
  ios-workflow:
    name: iOS Free - Sideloadly iOS 26.6 FINAL
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Setup Flutter & Pods
        script: |
          set -ex
          ls -la
          if [ -f "pubspec.yaml" ]; then
            echo ">>> Flutter project detected"
            flutter --version
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock build
            flutter pub get
            cd ios
            pod repo update || true
            pod install --repo-update
            cd ..
          else
            if [ -d "ios" ]; then
              cd ios
              pod install --repo-update || true
              cd ..
            fi
            if [ -f "Podfile" ]; then
              pod install --repo-update || true
            fi
          fi

      - name: STRIP Push & Associated Domains
        script: |
          set -ex
          echo ">>> Stripping entitlements for free Apple ID"
          find . -name "*.entitlements" -type f -print | while read ENT; do
            echo "=== $ENT ==="
            cat "$ENT"
            plutil -remove com.apple.developer.associated-domains "$ENT" 2>&1 || true
            plutil -remove aps-environment "$ENT" 2>&1 || true
            plutil -remove com.apple.developer.applesignin "$ENT" 2>&1 || true
            plutil -remove com.apple.developer.push-notifications "$ENT" 2>&1 || true
            cat "$ENT" || true
          done
          echo ">>> Done stripping"

      - name: Build IPA - Robust Method
        script: |
          set -ex
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa /tmp/xcodebuild.log
          mkdir -p build/ios/ipa
          APP_PATH=""

          # Method 1: Flutter build (most reliable for Flutter)
          if [ -f "pubspec.yaml" ]; then
            echo ">>> Trying flutter build ios --release --no-codesign"
            flutter build ios --release --no-codesign --verbose 2>&1 | tee /tmp/flutter_build.log || true
            # Find app from flutter build
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
            echo "After flutter build, APP_PATH=$APP_PATH"
          fi

          # Method 2: If still not found, try xcodebuild archive
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Flutter app not found, trying xcodebuild archive"
            if [ -d "ios/Runner.xcworkspace" ]; then
              WORKSPACE="ios/Runner.xcworkspace"
              if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then SCHEME="g000st"; else SCHEME="Runner"; fi
              XCODE_BASE_ARGS="-workspace $WORKSPACE -scheme $SCHEME"
            elif [ -d "g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace g000st.xcworkspace -scheme g000st"
            elif [ -d "ios/g000st.xcworkspace" ]; then
              XCODE_BASE_ARGS="-workspace ios/g000st.xcworkspace -scheme g000st"
            else
              XCODE_BASE_ARGS="-project g000st.xcodeproj -scheme g000st"
            fi
            echo "Archive args: $XCODE_BASE_ARGS"
            xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true
            # Search in archive and derived data
            APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1)
            fi
          fi

          # Method 3: Last resort search everywhere
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ">>> Searching everywhere for .app"
            find . -name "*.app" -type d 2>/dev/null | head -n 20
            APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1)
          fi

          echo "FINAL APP: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "!!! APP NOT FOUND - Printing logs !!!"
            echo "=== flutter_build.log tail ==="
            tail -n 200 /tmp/flutter_build.log 2>&1 || true
            echo "=== xcodebuild.log tail ==="
            tail -n 300 /tmp/xcodebuild.log 2>&1 || true
            exit 1
          fi

          ls -lh "$APP_PATH"
          du -sh "$APP_PATH"
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-sideloadly-fixed.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-sideloadly-fixed.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo ">>> SUCCESS - IPA ready for Sideloadly"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
      - /tmp/flutter_build.log
