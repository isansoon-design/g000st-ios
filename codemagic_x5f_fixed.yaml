workflows:
  ios-workflow:
    name: iOS 26.6 - 3uTools WORKING
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
      vars:
        XCODE_PROJECT: g000st.xcodeproj
        XCODE_SCHEME: g000st
    scripts:
      - name: Setup Flutter & Pods
        script: |
          set -ex
          if [ -f "pubspec.yaml" ]; then
            flutter clean
            rm -rf ios/Pods ios/Podfile.lock
            flutter pub get
            cd ios
            pod repo update || true
            pod install --repo-update || true
            cd ..
          fi
          if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update || true
            cd ..
          fi

      - name: STRIP Push & Associated Domains
        script: |
          set -ex
          find . -name "*.entitlements" -type f | while read ENT; do
            echo "Found: $ENT"
            plutil -remove com.apple.developer.associated-domains "$ENT" 2>&1 || true
            plutil -remove aps-environment "$ENT" 2>&1 || true
            plutil -remove com.apple.developer.push-notifications "$ENT" 2>&1 || true
          done || true
          echo "Stripped"

      - name: Build IPA - WORKS
        script: |
          set -x
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa
          mkdir -p build/ios/ipa
          APP_PATH=""

          # This is the exact method that built 3.39MB successfully
          if [ -d "ios/Runner.xcworkspace" ]; then
            WORKSPACE="ios/Runner.xcworkspace"
            if xcodebuild -list -workspace "$WORKSPACE" 2>&1 | grep -q "g000st"; then SCHEME="g000st"; else SCHEME="Runner"; fi
            XCODE_BASE_ARGS="-workspace $WORKSPACE -scheme $SCHEME"
          elif [ -d "g000st.xcworkspace" ]; then
            XCODE_BASE_ARGS="-workspace g000st.xcworkspace -scheme g000st"
          elif [ -d "ios/g000st.xcworkspace" ]; then
            XCODE_BASE_ARGS="-workspace ios/g000st.xcworkspace -scheme g000st"
          else
            XCODE_BASE_ARGS="-project g000st.xcodeproj -scheme g000st"
          fi

          echo "Building $XCODE_BASE_ARGS"
          xcodebuild archive $XCODE_BASE_ARGS -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true

          APP_PATH=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find build -name "*.app" -type d 2>/dev/null | head -n 1); fi
          if [ -z "$APP_PATH" ]; then APP_PATH=$(find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi

          echo "FINAL APP: $APP_PATH"
          ls -lh "$APP_PATH" || true
          du -sh "$APP_PATH" || true

          if [ -z "$APP_PATH" ]; then
            echo "No .app found, printing log"
            tail -n 100 /tmp/xcodebuild.log || true
            exit 1
          fi

          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-3uTools-WORKING.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-3uTools-WORKING.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo ">>> IPA READY for 3uTools"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
