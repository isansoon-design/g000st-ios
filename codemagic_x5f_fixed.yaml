workflows:
  ios-workflow:
    name: iOS FINAL 3.39MB WORKING
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      flutter: stable
      cocoapods: default
    scripts:
      - name: DIAGNOSE Project Structure
        script: |
          set -x
          echo "=== ROOT ==="
          ls -la | head -30
          echo "=== Find workspaces/projects ==="
          find . -maxdepth 3 -name "*.xcworkspace" -o -name "*.xcodeproj" 2>/dev/null
          echo "=== pubspec? ==="
          ls -lh pubspec.yaml 2>&1 || echo "No pubspec"
          echo "=== ios folder ==="
          ls -lh ios/ 2>&1 | head -40
          echo "=== g000st.xcodeproj ==="
          ls -lh g000st.xcodeproj/ 2>&1 | head -20 || true

      - name: Setup - Remove Broken Pods
        script: |
          set -x
          # Remove broken Pods that cause XCFileList error
          rm -rf ios/Pods ios/Podfile.lock Pods Podfile.lock build
          if [ -f "pubspec.yaml" ]; then
            flutter clean || true
            flutter pub get || true
            # Only install pods if Podfile exists
            if [ -f "ios/Podfile" ]; then
              cd ios
              pod install --repo-update || true
              cd ..
            fi
          fi

      - name: Build g000st - The Method That Made 3.39MB
        script: |
          set -x
          rm -rf /tmp/g000st.xcarchive /tmp/Payload /tmp/DerivedData build/ios/ipa /tmp/*.log
          mkdir -p build/ios/ipa
          
          # This is the EXACT method that built your 3.39MB IPA that installed in 3uTools
          # Use g000st.xcodeproj NOT Runner.xcworkspace
          echo "Building g000st.xcodeproj scheme g000st..."
          xcodebuild archive -project g000st.xcodeproj -scheme g000st -configuration Release -archivePath /tmp/g000st.xcarchive -destination "generic/platform=iOS" -derivedDataPath /tmp/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO ENABLE_USER_SCRIPT_SANDBOXING=NO SKIP_INSTALL=NO 2>&1 | tee /tmp/xcodebuild.log || true
          
          echo "=== Searching for .app ==="
          find /tmp/g000st.xcarchive -name "*.app" -type d 2>/dev/null
          find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | head -10
          find build -name "*.app" -type d 2>/dev/null | head -10
          find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -10
          
          APP=$(find /tmp/g000st.xcarchive/Products/Applications -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then APP=$(find /tmp/DerivedData -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi
          if [ -z "$APP" ]; then APP=$(find build -name "*.app" -type d 2>/dev/null | head -n 1); fi
          if [ -z "$APP" ]; then APP=$(find . -name "*.app" -type d 2>/dev/null | grep -v Tests | head -n 1); fi
          
          echo "FINAL APP: $APP"
          if [ -z "$APP" ]; then
            echo "NO APP FOUND - Last 200 lines of log:"
            tail -n 200 /tmp/xcodebuild.log
            exit 1
          fi
          
          ls -lh "$APP"
          du -sh "$APP"
          ls "$APP" | head -20
          
          # Check binary exists
          if [ ! -f "$APP/g000st" ] && [ ! -f "$APP/Runner" ]; then
            echo "Binary missing inside .app! Listing:"
            find "$APP" -type f | head -20
          fi
          
          SIZE=$(du -sk "$APP" | cut -f1)
          echo "App size KB: $SIZE"
          if [ "$SIZE" -lt 1000 ]; then
            echo "WARNING: App too small (<1MB), will be empty IPA!"
          fi
          
          mkdir -p /tmp/Payload
          rm -rf /tmp/Payload/*
          cp -R "$APP" /tmp/Payload/
          cd /tmp
          zip -r -9 g000st-WORKING-3MB.ipa Payload
          mkdir -p $CM_BUILD_DIR/build/ios/ipa
          mv /tmp/g000st-WORKING-3MB.ipa $CM_BUILD_DIR/build/ios/ipa/
          ls -lh $CM_BUILD_DIR/build/ios/ipa/
          echo "IPA READY - Should be ~3.39MB not 166B"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild.log
