# Install libnginx-mod-http-geoip2 and the DB-IP City Lite database first.
# Loaded in nginx's http context, e.g. /etc/nginx/conf.d/g000st-geoip.conf.
# Use the TCP peer address; never accept geolocation or IP headers from clients.
geoip2 /var/lib/g000st/geoip/dbip-city-lite.mmdb {
    auto_reload 5m;
    $g000st_geo_country source=$remote_addr country iso_code;
    $g000st_geo_city source=$remote_addr city names en;
}
