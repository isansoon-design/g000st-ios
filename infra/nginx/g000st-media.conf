map $http_origin $g000st_media_cors_origin {
    default "";
    "https://g000st.com" $http_origin;
    "https://www.g000st.com" $http_origin;
    "https://staging.g000st.com" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:8081" $http_origin;
    "http://localhost:8082" $http_origin;
}

server {
    listen 80;
    server_name media.g000st.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.g000st.com;

    ssl_certificate /etc/letsencrypt/live/media.g000st.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.g000st.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $g000st_media_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Vary Origin always;
            return 204;
        }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;

        add_header Access-Control-Allow-Origin $g000st_media_cors_origin always;
        add_header Access-Control-Expose-Headers ETag always;
        add_header Vary Origin always;
    }
}
